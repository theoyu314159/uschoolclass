<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竹北實驗排課模擬系統</title>
<link rel="icon" href="https://i.meee.com.tw/9A7xDcC.png" type="image/x-icon">
<link rel="stylesheet" href="style.css">
<!-- 引入 html2canvas 用於將課表匯出為高畫質圖片 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="app">
  <header>
    <div class="header-actions">
      <button class="reset-btn" id="resetBtn">↺ 重新</button>
      <button class="export-btn" id="exportBtn">📸 匯出課表</button>
    </div>
    <h1>竹北實驗高中排課模擬系統<span id="levelLabel">第一關・國數英</span></h1>
    <div class="level-progress" id="levelProgress"></div>
  </header>

  <main>
    <aside class="course-pool">
      <div class="pool-hint">選修課程點一下會自動排好全部堂數；社團、非同步課程請拖曳到課表中。ABC不可重複。</div>
      <div id="coursePool"></div>
    </aside>

    <!-- 加上 id="exportTarget" 作為截圖範圍 -->
    <section class="schedule-wrap" id="exportTarget">
      <div class="export-header" id="exportHeader">
        <span class="export-title">竹北實驗高中 模擬課表</span>
        <span class="export-meta" id="exportMeta"></span>
      </div>
      <div class="schedule-grid" id="scheduleGrid"></div>
    </section>
  </main>
</div>

<div id="ghost" hidden></div>
<div id="toast" class="toast"></div>

<footer class="site-footer">
  <a href="https://uschool.hcc.edu.tw/" target="_blank" rel="noopener noreferrer">Design by - 竹北實驗高中</a> & <a href="https://theoyu314159.github.io/" target="_blank" rel="noopener noreferrer">Yuyoru</a>
</footer>

<script src="script.js"></script>
</body>
</html>
